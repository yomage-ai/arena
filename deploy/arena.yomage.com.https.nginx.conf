server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/arena.yomage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.yomage.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name arena.yomage.com;

    root /var/www/arena.yomage.com/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/arena.yomage.com.access.log;
    error_log /var/log/nginx/arena.yomage.com.error.log;

    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arena.yomage.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # This server's default MIME map predates .mjs and .woff2.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~* \.woff2$ {
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name arena.yomage.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arena.yomage.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://arena.yomage.com$request_uri;
    }
}
