<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>月面巡视器 · 高精度三维交互场景</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%239a9a96'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%237c7c78'/%3E%3Ccircle cx='20' cy='19' r='2.2' fill='%237c7c78'/%3E%3Ccircle cx='21' cy='10' r='1.4' fill='%237c7c78'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --ink:#d9e2ec;
  --ink-dim:#8b99a8;
  --ink-faint:#5d6a78;
  --line:rgba(190,208,226,.18);
  --line-strong:rgba(190,208,226,.34);
  --amber:#d8a24a;
  --amber-dim:rgba(216,162,74,.16);
  --panel:rgba(7,11,16,.62);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#scene:active{cursor:grabbing}

/* ===== 加载遮罩 ===== */
#loader{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s ease}
#loader.done{opacity:0;pointer-events:none}
.moon-mark{width:64px;height:64px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}
#loader .load-text{font-size:13px;letter-spacing:.32em;color:var(--ink-dim);text-indent:.32em;font-weight:300}
#loader .load-bar{width:180px;height:1px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
#loader .load-bar i{position:absolute;inset:0;width:40%;background:var(--amber);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}

/* ===== HUD 通用 ===== */
.hud{position:fixed;z-index:10;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line)}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border-color:var(--amber);border-style:solid;opacity:.85}
.panel::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.panel::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

/* 左上标题 */
#hud-title{top:22px;left:26px;max-width:min(460px,60vw)}
#hud-title h1{font-size:17px;font-weight:500;letter-spacing:.14em;color:#eef3f8}
#hud-title .en{font-size:10px;letter-spacing:.3em;color:var(--amber);margin-top:7px;font-weight:400;text-indent:.04em}
#hud-title .rule{width:42px;height:1px;background:var(--amber);margin:11px 0 9px;opacity:.75}
#hud-title p{font-size:11.5px;line-height:1.75;color:var(--ink-dim);font-weight:300;letter-spacing:.04em}

/* 右上操作提示 */
#hud-help{top:22px;right:26px;width:208px;padding:13px 16px;font-size:11px;line-height:2;color:var(--ink-dim);font-weight:300;letter-spacing:.05em}
#hud-help .k{display:inline-block;min-width:58px;color:var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.02em}
#hud-help .dot{color:var(--amber);margin-right:8px}

/* 左下遥测 */
#hud-telemetry{left:26px;bottom:26px;width:248px;padding:15px 17px 13px}
#hud-telemetry .t-title{font-size:10px;letter-spacing:.34em;color:var(--ink-faint);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#hud-telemetry .t-title .live{display:flex;align-items:center;gap:6px;letter-spacing:.18em;color:var(--amber)}
#hud-telemetry .t-title .live i{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px var(--amber);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.t-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed rgba(190,208,226,.08)}
.t-row:last-child{border-bottom:none}
.t-row .lbl{font-size:11px;color:var(--ink-dim);letter-spacing:.08em}
.t-row .val{font-family:var(--mono);font-size:12.5px;color:#eef3f8;letter-spacing:.02em}
.t-row .val .unit{font-size:9.5px;color:var(--ink-faint);margin-left:3px}
.t-row .val.st-run{color:#7fc98c}
.t-row .val.st-pause{color:var(--amber)}
#t-mode.st-run{color:#7fc98c}
#t-mode.st-pause{color:var(--amber)}

/* 右下控制 */
#hud-ctrl{right:26px;bottom:26px;display:flex;gap:10px;pointer-items:none}
.btn{pointer-events:auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;padding:11px 16px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:border-color .2s,background .2s,color .2s;font-weight:400}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--line-strong);background:rgba(18,26,36,.75)}
.btn.on{border-color:rgba(216,162,74,.6);background:var(--amber-dim);color:var(--amber)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 底部中央提示 */
#hud-hint{bottom:30px;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.26em;color:var(--ink-faint);text-indent:.26em;font-weight:300;white-space:nowrap}
@media (max-width:760px){
  #hud-title{top:16px;left:16px;max-width:74vw}
  #hud-title h1{font-size:14px}
  #hud-title .en{font-size:8.5px;letter-spacing:.16em}
  #hud-title p{display:none}
  #hud-help{display:none}
  #hud-telemetry{left:14px;bottom:14px;width:200px;padding:11px 13px}
  #hud-ctrl{right:14px;bottom:14px;flex-direction:column;gap:8px}
  .btn{padding:9px 12px;font-size:10.5px}
  #hud-hint{display:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- 加载遮罩 -->
<div id="loader">
  <svg class="moon-mark" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="25" fill="none" stroke="#9a9a96" stroke-width="1.2"/>
    <circle cx="24" cy="25" r="5.5" fill="none" stroke="#7c7c78" stroke-width="1"/>
    <circle cx="40" cy="38" r="4" fill="none" stroke="#7c7c78" stroke-width="1"/>
    <circle cx="41" cy="21" r="2.4" fill="none" stroke="#7c7c78" stroke-width="1"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="#d8a24a" stroke-width=".7" stroke-dasharray="4 6" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="9s" repeatCount="indefinite"/>
    </circle>
  </svg>
  <div class="load-text">正在构建月面环境</div>
  <div class="load-bar"><i></i></div>
</div>

<!-- 左上：标题 -->
<header id="hud-title" class="hud">
  <h1>月面巡视器 · 三维交互场景</h1>
  <div class="en">LUNAR SURFACE ROVER · REAL-TIME 3D</div>
  <div class="rule"></div>
  <p>巡视器正沿预定考察路线低速行驶，六轮独立悬挂随月面起伏自适应调整。<br>你可以随时环绕、缩放或脱离跟随，自由浏览整个着陆区。</p>
</header>

<!-- 右上：操作 -->
<div id="hud-help" class="hud panel">
  <div><span class="dot">·</span><span class="k">左键拖拽</span>环绕 / 旋转视角</div>
  <div><span class="dot">·</span><span class="k">滚轮</span>缩放观察距离</div>
  <div><span class="dot">·</span><span class="k">右键拖拽</span>平移浏览位置</div>
</div>

<!-- 左下：遥测 -->
<div id="hud-telemetry" class="hud panel">
  <div class="t-title"><span>遥测 TELEMETRY</span><span class="live"><i></i><span id="t-mode">行驶中</span></span></div>
  <div class="t-row"><span class="lbl">行驶速度</span><span class="val" id="t-speed">0.00<span class="unit">m/s</span></span></div>
  <div class="t-row"><span class="lbl">累计里程</span><span class="val" id="t-dist">0.0<span class="unit">m</span></span></div>
  <div class="t-row"><span class="lbl">坐标 X / Z</span><span class="val" id="t-pos">0.0 / 0.0</span></div>
  <div class="t-row"><span class="lbl">俯仰 / 横滚</span><span class="val" id="t-att">0.0° / 0.0°</span></div>
  <div class="t-row"><span class="lbl">太阳高度角</span><span class="val" id="t-sun">24.0°</span></div>
</div>

<!-- 右下：控制 -->
<div id="hud-ctrl" class="hud">
  <button class="btn on" id="btn-follow" aria-pressed="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 6a6 6 0 0 1 6 6"/></svg>
    <span id="follow-label">跟随视角</span>
  </button>
  <button class="btn" id="btn-pause" aria-pressed="false">
    <svg viewBox="0 0 24 24" id="pause-icon"><rect x="7" y="5" width="3.2" height="14"/><rect x="13.8" y="5" width="3.2" height="14"/></svg>
    <span id="pause-label">暂停行驶</span>
  </button>
  <button class="btn" id="btn-reset">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    <span>重置视角</span>
  </button>
</div>

<div id="hud-hint" class="hud">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
window.__SCENE_READY__ = false;

/* ===== 1. 渲染器 / 场景 / 相机 ===== */
const canvas = document.getElementById('scene');
const isMobile = matchMedia('(max-width:760px)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0034); // 真空无大气雾，仅用于地形边缘融入黑色天空

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 2200);
camera.position.set(9, 6.2, 12);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.4;
controls.maxDistance = 75;
controls.maxPolarAngle = 1.535;   // 约 88°，防止穿到月面之下
controls.enablePan = true;
controls.screenSpacePanning = false;
controls.target.set(0, 1.2, 0);

const SUN_DIR = new THREE.Vector3(-0.42, 0.405, -0.81).normalize(); // 太阳高度角约 24°

/* ===== 2. 确定性噪声与月面高度场 ===== */
// 整数哈希 → [0,1)
function hash2(ix, iz) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  const u = smooth(fx), v = smooth(fz);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z, oct = 5) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * (valueNoise(x * freq, z * freq) * 2 - 1);
    norm += amp;
    amp *= 0.5;
    freq *= 2.07;
  }
  return sum / norm;
}

// 预生成陨石坑（确定性分布：小坑多、大坑少）
const CRATERS = [];
(function genCraters() {
  let seed = 20260922;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  // 大型地貌坑
  for (let i = 0; i < 14; i++) {
    const ang = rnd() * Math.PI * 2, rad = 70 + rnd() * 115;
    const r = 16 + rnd() * 26;
    CRATERS.push({ x: Math.cos(ang) * rad, z: Math.sin(ang) * rad, r, d: r * (0.1 + rnd() * 0.05) });
  }
  // 中型坑
  for (let i = 0; i < 46; i++) {
    const ang = rnd() * Math.PI * 2, rad = 18 + rnd() * 165;
    const r = 4 + rnd() * 11;
    CRATERS.push({ x: Math.cos(ang) * rad, z: Math.sin(ang) * rad, r, d: r * (0.12 + rnd() * 0.06) });
  }
  // 巡视路线区的小型坑（浅而密，供悬挂响应）
  for (let i = 0; i < 26; i++) {
    const ang = rnd() * Math.PI * 2, rad = 6 + rnd() * 48;
    const r = 0.9 + rnd() * 2.6;
    CRATERS.push({ x: Math.cos(ang) * rad, z: Math.sin(ang) * rad, r, d: r * (0.1 + rnd() * 0.05) });
  }
})();

function craterContribution(x, z) {
  let h = 0;
  for (let i = 0; i < CRATERS.length; i++) {
    const cr = CRATERS[i];
    const dx = x - cr.x, dz = z - cr.z;
    const d2 = dx * dx + dz * dz;
    const cut = cr.r * 2.3;
    if (d2 > cut * cut) continue;
    const d = Math.sqrt(d2) / cr.r;
    const bowl = -cr.d * Math.exp(-d * d * 3.1);                    // 碗状凹陷
    const rim = cr.d * 0.24 * Math.exp(-(d - 1) * (d - 1) * 20);    // 环形隆起坑缘
    const ejecta = cr.d * 0.05 * Math.exp(-(d - 1.45) * (d - 1.45) * 5); // 喷发物缓丘
    h += bowl + rim + ejecta;
  }
  return h;
}

// 月面高度场（米）。大尺度起伏 + 细微波纹 + 陨石坑
const H0 = (() => {
  const base = fbm(7.3, -2.1, 5) * 5 + fbm(-9.7, 4.2, 4) * 0.8 + fbm(0, 0, 3) * 0.18 + craterContribution(0, 0);
  return base;
})();
function heightAt(x, z) {
  const macro = fbm(x * 0.011 + 7.3, z * 0.011 - 2.1, 5) * 5;
  const mid = fbm(x * 0.045 - 9.7, z * 0.045 + 4.2, 4) * 0.8;
  const fine = fbm(x * 0.22, z * 0.22, 3) * 0.18;
  return macro + mid + fine + craterContribution(x, z) - H0;
}
// 数值法线（供车轮接地、车身姿态采样）
const _n = new THREE.Vector3();
function normalAt(x, z, out = _n) {
  const e = 0.35;
  const hL = heightAt(x - e, z), hR = heightAt(x + e, z);
  const hD = heightAt(x, z - e), hU = heightAt(x, z + e);
  out.set(hL - hR, 2 * e, hD - hU).normalize();
  return out;
}

/* ===== 3. 程序化纹理（月壤 / 金箔 / 太阳翼 / 筛网轮） ===== */
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function makeCanvas(size = 512, h = size) {
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = h;
  return [cv, cv.getContext('2d')];
}
function toTexture(cv, srgb = true, repeatX = 1, repeatY = 1) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = Math.min(MAX_ANISO, 8);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---- 月壤：颜色 / 凹凸 / 粗糙度（三通道同源，凹处积灰更粗糙） ----
function makeRegolithTextures() {
  const S = 512;
  const [cAlb, ctxA] = makeCanvas(S), [cBump, ctxB] = makeCanvas(S), [cRgh, ctxR] = makeCanvas(S);
  const imgA = ctxA.createImageData(S, S), imgB = ctxB.createImageData(S, S), imgR = ctxR.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const n1 = valueNoise(x * 0.06, y * 0.06), n2 = valueNoise(x * 0.31 + 40, y * 0.31 - 12);
    const grain = hash2(x, y) - 0.5;
    const v = n1 * 0.62 + n2 * 0.26 + grain * 0.12;           // -1..1
    const g = 106 + v * 26;                                     // 月壤低反照率中灰
    const i = (y * S + x) * 4;
    imgA.data[i] = g + 6; imgA.data[i + 1] = g + 4; imgA.data[i + 2] = g; imgA.data[i + 3] = 255;
    const b = 128 + v * 46;
    imgB.data[i] = imgB.data[i + 1] = imgB.data[i + 2] = b; imgB.data[i + 3] = 255;
    const r = 236 - v * 12;                                     // 凹处略粗糙
    imgR.data[i] = imgR.data[i + 1] = imgR.data[i + 2] = r; imgR.data[i + 3] = 255;
  }
  ctxA.putImageData(imgA, 0, 0); ctxB.putImageData(imgB, 0, 0); ctxR.putImageData(imgR, 0, 0);

  // 微型撞击坑：暗盆 + 迎光亮缘（光源在画面左上）
  let seed = 771;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  for (let k = 0; k < 17; k++) {
    const cx = rnd() * S, cy = rnd() * S, r = 2.5 + rnd() * 8;
    const grad = ctxA.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(58,56,52,.85)');
    grad.addColorStop(0.55, 'rgba(96,93,88,.45)');
    grad.addColorStop(0.82, 'rgba(178,174,166,.5)');
    grad.addColorStop(1, 'rgba(132,130,126,0)');
    ctxA.fillStyle = grad; ctxA.beginPath(); ctxA.arc(cx, cy, r, 0, 7); ctxA.fill();
    const gb = ctxB.createRadialGradient(cx, cy, 0, cx, cy, r);
    gb.addColorStop(0, 'rgb(46,46,46)'); gb.addColorStop(0.6, 'rgb(96,96,96)');
    gb.addColorStop(0.85, 'rgb(190,190,190)'); gb.addColorStop(1, 'rgb(128,128,128)');
    ctxB.fillStyle = gb; ctxB.beginPath(); ctxB.arc(cx, cy, r, 0, 7); ctxB.fill();
  }
  // 散砾石
  for (let k = 0; k < 680; k++) {
    const x = rnd() * S, y = rnd() * S, r = 0.4 + rnd() * 1.3;
    const sh = rnd() > 0.5 ? 1 : -1;
    ctxA.fillStyle = sh > 0 ? 'rgba(178,174,166,.38)' : 'rgba(74,72,68,.45)';
    ctxA.beginPath(); ctxA.arc(x, y, r, 0, 7); ctxA.fill();
    ctxB.fillStyle = sh > 0 ? 'rgba(198,198,198,.45)' : 'rgba(70,70,70,.5)';
    ctxB.beginPath(); ctxB.arc(x, y, r, 0, 7); ctxB.fill();
  }
  return {
    albedo: toTexture(cAlb, true, 26, 26),
    bump: toTexture(cBump, false, 26, 26),
    rough: toTexture(cRgh, false, 26, 26)
  };
}

// ---- 褶皱金箔多层隔热材料 ----
function makeFoilTextures() {
  const S = 256;
  const [cAlb, ctxA] = makeCanvas(S), [cBump, ctxB] = makeCanvas(S);
  ctxA.fillStyle = '#b8913f'; ctxA.fillRect(0, 0, S, S);
  ctxB.fillStyle = '#808080'; ctxB.fillRect(0, 0, S, S);
  let seed = 9021;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  for (let k = 0; k < 520; k++) {
    const x = rnd() * S, y = rnd() * S, s = 4 + rnd() * 15;
    const l = 46 + rnd() * 30; // 褶皱明度差

const WAYPTS = [[0, 0], [26, -14], [45, 3], [31, 27], [-3, 41], [-33, 27], [-46, -1], [-27, -30], [7, -37], [-14, 8]];
const routePts = WAYPTS.map(([x, z]) => new THREE.Vector3(x, 0, z));
const routeCurve = new THREE.CatmullRomCurve3(routePts, true, 'catmullrom', 0.45);

for (let i = 0; i <= ROUTE_SAMPLES; i++) {

  const p = routeCurve.getPointAt(u);

  p.y = heightAt(p.x, p.z);

function makeRockGeometry(seed) {

}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x9b9890, roughness: .97, metalness: 0, bumpMap: regoTex.bump, bumpScale: .25 });
function distToRoute(x, z) {
  let best = 1e9;
  for (let i = 0; i < ROUTE_SAMPLES; i += 10) {
    const q = routeTable[i].p;
    const d = (q.x - x) * (q.x - x) + (q.z - z) * (q.z - z);
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
{

      const s = 0.12 + Math.pow(rnd(), 2.2) * 0.95;

const TRACK_OFFSET = 0.56, TRACK_HALF_W = 0.11;
function buildTrackRibbon(sideSign) {
  const positions = [], indices = [];
  const N = ROUTE_SAMPLES;
  for (let i = 0; i <= N; i++) {
    const { p, side } = routeTable[i];
    const cx = p.x + side.x * TRACK_OFFSET * sideSign, cz = p.z + side.z * TRACK_OFFSET * sideSign;
    const ch = heightAt(cx, cz);
    // 截面三顶点：外缘 / 槽底 / 内缘（微凸于地表，深色模拟轮下压实月壤）
    for (let q = 0; q < 3; q++) {
      const f = q - 1; // -1 外, 0 中, 1 内
      const dip = q === 1 ? 0.004 : 0.016;
      positions.push(cx + side.x * f * TRACK_HALF_W, ch + dip, cz + side.z * f * TRACK_HALF_W);
    }
  }
  for (let i = 0; i < N; i++) {
    for (let q = 0; q < 2; q++) {
      const a = i * 3 + q, b = (i + 1) * 3 + q, c = (i + 1) * 3 + q + 1, d = i * 3 + q + 1;
      indices.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.setDrawRange(0, 0); // 初始不渲染，随行驶逐段显现
  const m = new THREE.MeshBasicMaterial({ color: 0x53504a, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, revealed: 0 };
}
const tracks = [buildTrackRibbon(-1), buildTrackRibbon(1)];
function updateTracks(progress) { // progress: 已行驶弧长比例（0..1 循环，绕回后车辙保持全显）
  const total = ROUTE_SAMPLES;
  const target = Math.min(total, Math.floor((progress % 1) * total) + 2);
  for (const tr of tracks) {
    if (target <= tr.revealed) continue; // 绕回后保持已显现状态
    tr.revealed = target;
    tr.mesh.geometry.setDrawRange(0, target * 12); // 每段 4 三角形 × 3 索引
  }
}

const _up = new THREE.Vector3(0, 1, 0);
function makeTube(a, b, r, mat, radial = 8) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, radial), mat);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(_up, dir.normalize());
  m.castShadow = true;
  return m;
}
function updateTube(m, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(_up, dir.normalize());
  m.scale.set(1, len / m.userData.baseLen, 1);
}
function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, seg, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true;
  return m;
}

// ---- 筛网轮（轮面 + 轮缘 + 24 轮齿 + 轮毂辐条） ----
const WHEEL_R = .18, WHEEL_W = .15;
function buildWheel() {
  const g = new THREE.Group();
  const spin = new THREE.Group();
  g.add(spin);
  const tread = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, WHEEL_W, 36, 1, true), matWheel);
  tread.rotation.z = Math.PI / 2;
  tread.castShadow = true; spin.add(tread);
  // 两侧轮缘
  for (const sx of [-1, 1]) {
    const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R, .017, 8, 36), matTi);
    rim.rotation.y = Math.PI / 2; rim.position.x = sx * WHEEL_W / 2;
    rim.castShadow = true; spin.add(rim);
    // 辐条盘
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .012, 18), matDarkMetal);
    disc.rotation.z = Math.PI / 2; disc.position.x = sx * WHEEL_W / 2;
    spin.add(disc);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, WHEEL_W + .05, 16), matTi);
  hub.rotation.z = Math.PI / 2; hub.castShadow = true; spin.add(hub);
  // 三辐条
  for (let k = 0; k < 3; k++) {
    const ang = k * Math.PI * 2 / 3;
    const sp = box(.02, .025, .17, matDarkMetal);
    sp.rotation.x = ang;
    sp.position.set(0, Math.cos(ang) * .055, Math.sin(ang) * .055);
    spin.add(sp);
  }
  // 轮齿
  const toothGeo = new THREE.BoxGeometry(WHEEL_W + .02, .022, .035);
  for (let k = 0; k < 24; k++) {
    const th = k * Math.PI * 2 / 24;
    const t = new THREE.Mesh(toothGeo, matTi);
    t.position.set(0, Math.cos(th) * (WHEEL_R + .008), Math.sin(th) * (WHEEL_R + .008));
    t.rotation.x = -th;
    t.castShadow = true; spin.add(t);
  }
  g.userData.spin = spin;
  return g;
}

/* ===== 8. 行驶路径、悬挂姿态与扬尘 ===== */
const drive = { u: 0.006, speed: 1.05, paused: REDUCED_MOTION, distance: 0, yaw: 0 };
const _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3(), _t0 = new THREE.Vector3(), _t1 = new THREE.Vector3();
const _cur = new THREE.Vector3(), _tan = new THREE.Vector3();
const bodyAtt = { y: 0, pitch: 0, roll: 0 };

function routeAt(u, pOut, tOut) {
  u = ((u % 1) + 1) % 1;
  const fi = u * ROUTE_SAMPLES, i0 = Math.floor(fi), f = fi - i0;
  const A = routeTable[i0], B = routeTable[(i0 + 1) % ROUTE_SAMPLES];
  pOut.copy(A.p).lerp(B.p, f);
  tOut.copy(A.t).lerp(B.t, f).normalize();
}

// ---- 扬尘粒子（真空中弹道抛射，月球重力 1.62） ----
const DUST_N = 200;
const dustPos = new Float32Array(DUST_N * 3);
const dustAlpha = new Float32Array(DUST_N);
const dustSize = new Float32Array(DUST_N);
const dust = [];
for (let i = 0; i < DUST_N; i++) {
  dust.push({ life: 2, max: 1, vx: 0, vy: 0, vz: 0 }); // life>=max 即休眠
  dustPos[i * 3 + 1] = -999;
}
function makeDustTexture() {
  const [cv, ctx] = makeCanvas(64);
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(150,146,138,.85)'); g.addColorStop(.6, 'rgba(128,124,116,.35)'); g.addColorStop(1, 'rgba(120,116,108,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('aAlpha', new THREE.BufferAttribute(dustAlpha, 1));
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSize, 1));
const dustMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: { uTex: { value: makeDustTexture() } },
  vertexShader: `
    attribute float aAlpha; attribute float aSize; varying float vAlpha;
    void main(){ vAlpha = aAlpha; vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = aSize * (160.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform sampler2D uTex; varying float vAlpha;
    void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(t.rgb, t.a * vAlpha); }`
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
dustPoints.frustumCulled = false;
scene.add(dustPoints);
let dustCursor = 0, dustAccum = 0;
function emitDust(x, y, z, tx, tz, side) {
  const p = dust[dustCursor];
  dustCursor = (dustCursor + 1) % DUST_N;
  p.life = 0; p.max = .45 + Math.random() * .45; // 真空弹道颗粒，快速落回
  const back = .18 + Math.random() * .3, sideK = (Math.random() - .5) * .22;
  p.vx = -tx * back + tz * sideK * side + (Math.random() - .5) * .08;
  p.vz = -tz * back - tx * sideK * side + (Math.random() - .5) * .08;
  p.vy = .12 + Math.random() * .3;
  dustPos[dustCursor * 3] = x; dustPos[dustCursor * 3 + 1] = y; dustPos[dustCursor * 3 + 2] = z;
  dustAlpha[dustCursor] = .32; dustSize[dustCursor] = .03 + Math.random() * .04;
}
function updateDust(dt) {
  for (let i = 0; i < DUST_N; i++) {
    const p = dust[i];
    if (p.life >= p.max) { dustAlpha[i] = 0; dustPos[i * 3 + 1] = -999; continue; }
    p.life += dt;
    p.vy -= 1.62 * dt;
    let x = dustPos[i * 3] + p.vx * dt;
    let y = dustPos[i * 3 + 1] + p.vy * dt;
    let z = dustPos[i * 3 + 2] + p.vz * dt;
    const ground = heightAt(x, z) + .02;
    if (y < ground) { y = ground; p.vy = 0; p.vx *= .7; p.vz *= .7; p.life += dt * 2.2; }
    dustPos[i * 3] = x; dustPos[i * 3 + 1] = y; dustPos[i * 3 + 2] = z;
    const k = 1 - p.life / p.max;
    dustAlpha[i] = Math.max(0, k) * .34;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aAlpha.needsUpdate = true;
  dustGeo.attributes.aSize.needsUpdate = true;
}

// ---- 每帧行驶更新 ----
const wheelWorld = new THREE.Vector3();
function localToWorldXZ(lx, lz, yaw, px, pz, out) {
  out.set(px + lx * Math.cos(yaw) + lz * Math.sin(yaw), 0, pz - lx * Math.sin(yaw) + lz * Math.cos(yaw));
}
function updateDrive(dt) {
  if (!drive.paused) {
    drive.u = (drive.u + drive.speed * dt / ROUTE_LEN) % 1;
    drive.distance += drive.speed * dt;
  }
  routeAt(drive.u, _cur, _tan);
  const px = _cur.x, pz = _cur.z;
  drive.yaw = Math.atan2(-_tan.x, -_tan.z);
  rover.position.set(px, 0, pz);
  rover.rotation.y = drive.yaw;

  // 六轮独立接地
  const heights = [];
  for (const w of wheels) {
    localToWorldXZ(w.x, w.z, drive.yaw, px, pz, wheelWorld);
    const h = heightAt(wheelWorld.x, wheelWorld.z);
    heights.push(h);
    w.mesh.position.y = h + WHEEL_R;
    w.mesh.position.x = w.x; w.mesh.position.z = w.z;
    if (!drive.paused) w.spinAngle -= drive.speed * dt / WHEEL_R;
    w.spin.rotation.x = w.spinAngle;
  }
  // 车身高度 / 俯仰 / 横滚
  const hFL = heights[0], hML = heights[1], hRL = heights[2];
  const hFR = heights[3], hMR = heights[4], hRR = heights[5];
  const avg = (hFL + hML + hRL + hFR + hMR + hRR) / 6;
  const hF = (hFL + hFR) / 2, hR = (hRL + hRR) / 2;
  const hL = (hFL + hML + hRL) / 3, hS = (hFR + hMR + hRR) / 3;
  const targetY = avg + .5;
  const targetPitch = Math.atan2(hF - hR, 1.44);
  const targetRoll = Math.atan2(hS - hL, 1.16);
  const k = 1 - Math.exp(-dt * 6);
  bodyAtt.y += (targetY - bodyAtt.y) * k;
  bodyAtt.pitch += (targetPitch - bodyAtt.pitch) * k;
  bodyAtt.roll += (targetRoll - bodyAtt.roll) * k;
  bodyGroup.position.y = bodyAtt.y;
  bodyGroup.rotation.x = bodyAtt.pitch;
  bodyGroup.rotation.z = bodyAtt.roll;

  // 摇臂连杆随动
  for (const t of rockerTubes) {
    const A = new THREE.Vector3(t.side * .42, bodyAtt.y - .05, 0);
    let B;
    if (t.cross) B = new THREE.Vector3(t.side * .2, bodyAtt.y + .02, 0);
    else B = new THREE.Vector3(t.side * WHEEL_X, heights[t.wheelIdx] + WHEEL_R, t.z);
    updateTube(t.mesh, A, B);
  }

  // 太阳阴影跟随
  sunLight.position.set(px + SUN_DIR.x * 140, heightAt(px, pz) + 60 + SUN_DIR.y * 80, pz + SUN_DIR.z * 140);
  sunLight.target.position.set(px, heightAt(px, pz), pz);

  // 车辙
  updateTracks(drive.u);

  // 扬尘（两后轮）
  if (!drive.paused) {
    dustAccum += dt;
    while (dustAccum > .025) {
      dustAccum -= .025;
      for (const w of wheels) {
        if (w.z !== WHEEL_Z[2]) continue;
        localToWorldXZ(w.x, w.z + .05, drive.yaw, px, pz, wheelWorld);
        emitDust(wheelWorld.x, heightAt(wheelWorld.x, wheelWorld.z) + .08, wheelWorld.z, _tan.x, _tan.z, w.side);
      }
    }
  }
  updateDust(dt);

  rover.userData.cur = _cur.clone();
  rover.userData.tan = _tan.clone();
  rover.userData.bodyY = bodyAtt.y;
  rover.userData.att = { pitch: bodyAtt.pitch, roll: bodyAtt.roll };
}

/* ===== 9. HUD 交互与主循环 ===== */
const $ = id => document.getElementById(id);
let follow = true;
const lastAnchor = new THREE.Vector3();
let initialized = false;

function resetView() {
  const c = rover.userData.cur, bodyY = rover.userData.bodyY;
  const t = rover.userData.tan;
  camera.position.set(c.x - t.x * 8.6, bodyY + 4.1, c.z - t.z * 8.6);
  controls.target.set(c.x, bodyY + 0.85, c.z);
  lastAnchor.set(c.x, bodyY, c.z);
  follow = true;
  $('btn-follow').classList.add('on');
  $('btn-follow').setAttribute('aria-pressed', 'true');
  $('follow-label').textContent = '跟随视角';
}

// 初始定位
updateDrive(0);
resetView();
controls.update();
renderer.render(scene, camera);
window.__SCENE_READY__ = true;

// ---- 按钮 ----
$('btn-follow').addEventListener('click', () => {
  follow = !follow;
  const btn = $('btn-follow');
  btn.classList.toggle('on', follow);
  btn.setAttribute('aria-pressed', String(follow));
  $('follow-label').textContent = follow ? '跟随视角' : '自由浏览';
  if (follow) {
    const c = rover.userData.cur;
    lastAnchor.set(c.x, rover.userData.bodyY, c.z);
  }
});
const ICON_PAUSE = '<rect x="7" y="5" width="3.2" height="14"/><rect x="13.8" y="5" width="3.2" height="14"/>';
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
function syncPauseUI() {
  const btn = $('btn-pause');
  btn.classList.toggle('on', drive.paused);
  btn.setAttribute('aria-pressed', String(drive.paused));
  $('pause-icon').innerHTML = drive.paused ? ICON_PLAY : ICON_PAUSE;
  $('pause-label').textContent = drive.paused ? '继续行驶' : '暂停行驶';
  $('t-mode').textContent = drive.paused ? '已暂停' : '行驶中';
  $('t-mode').className = drive.paused ? 'st-pause' : 'st-run';
}
$('btn-pause').addEventListener('click', () => { drive.paused = !drive.paused; syncPauseUI(); });
syncPauseUI();
$('btn-reset').addEventListener('click', resetView);

// ---- 遥测 ----
let hudTick = 0;
function updateHUD() {
  const c = rover.userData.cur, att = rover.userData.att;
  $('t-speed').innerHTML = (drive.paused ? '0.00' : drive.speed.toFixed(2)) + '<span class="unit">m/s</span>';
  $('t-dist').innerHTML = drive.distance.toFixed(1) + '<span class="unit">m</span>';
  $('t-pos').textContent = `${c.x.toFixed(1)} / ${c.z.toFixed(1)}`;
  $('t-att').textContent = `${(att.pitch * 180 / Math.PI).toFixed(1)}° / ${(att.roll * 180 / Math.PI).toFixed(1)}°`;
}

// ---- 自适应 ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- 主循环 ----
const clock = new THREE.Clock();
let running = true;
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { clock.getDelta(); loop(); } });

function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateDrive(dt);
  const c = rover.userData.cur, bodyY = rover.userData.bodyY;

  if (follow) {
    camera.position.x += c.x - lastAnchor.x;
    camera.position.z += c.z - lastAnchor.z;
    controls.target.lerp(new THREE.Vector3(c.x, bodyY + 1.0, c.z), 1 - Math.exp(-dt * 3.5));
  }
  lastAnchor.set(c.x, bodyY, c.z);

  // 限位：禁止穿入月面、禁止驶离地形边缘
  const gh = heightAt(camera.position.x, camera.position.z);
  if (camera.position.y < gh + 1.0) camera.position.y = gh + 1.0;
  const r = Math.hypot(camera.position.x, camera.position.z);
  if (r > 175) {
    camera.position.x *= 175 / r; camera.position.z *= 175 / r;
  }
  controls.update();

  // 地球缓慢自转
  skyMain.earth.rotation.y += dt * 0.006;

  if ((hudTick++ % 6) === 0) updateHUD();
  renderer.render(scene, camera);
}

// 首帧已同步渲染，启动循环并淡出加载层
requestAnimationFrame(() => {
  $('loader').classList.add('done');
});
loop();
</script>
