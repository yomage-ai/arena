  <script type="module">

    const woodCanvas=document.createElement('canvas'); woodCanvas.width=512;woodCanvas.height=512;

    const tagCanvas=document.createElement('canvas');tagCanvas.width=256;tagCanvas.height=256;
    const tc=tagCanvas.getContext('2d');tc.clearRect(0,0,256,256);tc.fillStyle='#4f3c31';tc.textAlign='center';tc.font='bold 51px Georgia';tc.fillText('Nº 07',128,121);tc.font='27px Georgia';tc.fillText('MARE',128,164);
    const tagInk=new THREE.Mesh(new THREE.PlaneGeometry(.43,.43),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(tagCanvas),transparent:true,depthWrite:false}));tagInk.position.set(4.6,-1.39,.672);tagInk.rotation.z=.12;bottleRig.add(tagInk);

    for(const sign of [-1,1])amphora.add(new THREE.Mesh(new THREE.TubeGeometry(handleCurve(sign),12,.023,5,false),ceramic));
    for(const [cx,cy,cz,col] of [[2.88,-1.3,-.64,0xc76666],[-2.69,-1.43,.62,0xde8c70],[.16,-1.52,1.18,0xb95765]]){
      const coral=new THREE.Group();coral.position.set(cx,cy,cz);wreck.add(coral);
      const cm=material(col,.9);rod(coral,[0,0,0],[0,.35,0],.045,cm);
      for(let i=0;i<5;i++){const a=i*TAU/5,r=.17+rand()*.12;
        rod(coral,[0,.18,0],[Math.cos(a)*r,.3,Math.sin(a)*r],.031,cm);
        rod(coral,[Math.cos(a)*r,.3,Math.sin(a)*r],[Math.cos(a)*(r+.06),.43+rand()*.12,Math.sin(a)*(r+.06)],.025,cm);
      }
    }
    const fishGroups=[];
    for(let g=0;g<3;g++){
      const school=new THREE.Group();wreck.add(school);fishGroups.push(school);
      const fishColor=material([0xc3b690,0x8bbbb9,0xd7ae82][g],.65,.15);
      for(let i=0;i<7;i++){
        const f=new THREE.Group();f.position.set((rand()-.5)*.6,(rand()-.5)*.22,(rand()-.5)*.3);school.add(f);
        box(f,0,0,0,.11,.045,.04,fishColor);
        const t=new THREE.Mesh(new THREE.ConeGeometry(.045,.08,3),fishColor);t.rotation.z=Math.PI/2;t.position.x=-.085;f.add(t);
        sphere(f,.035,.012,.023,.008,material(0x25282b),6);
      }
    }
    const bubbles=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.027,1),new THREE.MeshBasicMaterial({color:0x9bdcda,transparent:true,opacity:.45,depthWrite:false}),44);
    bubbles.frustumCulled=false;wreck.add(bubbles);
    const bubbleData=Array.from({length:44},(_,i)=>({x:[-1.9,2.7,-3.0][i%3]+(rand()-.5)*.35,z:[.7,-.5,-.6][i%3]+(rand()-.5)*.3,y:-1.65+rand()*1.14,s:.13+rand()*.14,p:rand()*TAU}));

    // Floating side stories: a striped buoy, six gulls, clouds, and a leaping whale.
    const buoy=new THREE.Group();bottleRig.add(buoy);
    cylinder(buoy,0,.02,0,.08,.105,.29,red,10);
    cylinder(buoy,0,.03,0,.085,.085,.095,ivory,10);
    rod(buoy,[0,.18,0],[0,.39,0],.018,darkBrass);
    sphere(buoy,0,.41,0,.035,lightMat,9);
    const gulls=[];for(let i=0;i<6;i++){
      const g=new THREE.Group();bottleRig.add(g);gulls.push(g);
      const wing=material(0xece9d9,.9);
      box(g,0,0,0,.10,.025,.04,wing);
      rod(g,[0,0,0],[-.14,.035,.035],.013,wing,5);
      rod(g,[0,0,0],[.14,.035,.035],.013,wing,5);
      sphere(g,.055,.01,0,.022,wing,7);
      const beak=new THREE.Mesh(new THREE.ConeGeometry(.018,.047,4),material(0xd6a45b));beak.rotation.z=-Math.PI/2;beak.position.x=.082;g.add(beak);
    }
    const cloudBlocks=[];for(const [cx,cy,cz,n] of [[-2.63,1.56,-.43,22],[-.62,1.63,-.55,17],[2.25,1.58,-.47,18]]){
      for(let i=0;i<n;i++){
        const x=cx+(rand()-.5)*.95,y=cy+(rand()-.5)*.18,z=cz+(rand()-.5)*.28,s=.12+rand()*.19;
        if(Math.hypot(Math.abs(y)+s*.32,Math.abs(z)+s*.52)>1.83)continue;cloudBlocks.push({x,y,z,s});
      }
    }
    const cloudMat=material(0xffffff,1);
    const clouds=new THREE.InstancedMesh(cube,cloudMat,cloudBlocks.length);
    cloudBlocks.forEach((b,i)=>{dummy.position.set(b.x,b.y,b.z);dummy.scale.set(b.s*1.3,b.s*.62,b.s);dummy.updateMatrix();clouds.setMatrixAt(i,dummy.matrix);clouds.setColorAt(i,new THREE.Color(i%4===0?0xd5d3c9:0xf4eee0));});
    clouds.instanceMatrix.needsUpdate=true;clouds.instanceColor.needsUpdate=true;bottleRig.add(clouds);dummy.scale.set(1,1,1);
    const whale=new THREE.Group();bottleRig.add(whale);
    const whaleBlue=material(0x325c63,.7),whaleLight=material(0x8cb5b5,.8);
    sphere(whale,0,0,0,.32,whaleBlue,10).scale.set(1.35,.7,.68);
    sphere(whale,.08,-.13,.02,.19,whaleLight,8).scale.set(1.35,.34,.75);
    box(whale,-.39,.02,0,.32,.10,.08,whaleBlue,0,0,-.13);
    for(const s of [-1,1])box(whale,-.6,.1,s*.12,.21,.055,.16,whaleBlue,0,s*.2,s*.32);
    box(whale,.28,-.01,.25,.2,.038,.16,whaleBlue,0,-.4,0);
    sphere(whale,.25,.04,.15,.018,material(0x142b32),7);
    whale.visible=false;

    const lightning=new THREE.Group();bottleRig.add(lightning);
    const boltPoints=[[-1.82,1.77,-1.42],[-1.7,1.48,-1.40],[-1.82,1.34,-1.39],[-1.53,1.05,-1.37],[-1.6,.77,-1.35]];
    line(lightning,boltPoints,0xe7f7ff,1);line(lightning,[boltPoints[2],[-1.33,1.25,-1.39],[-1.24,1.04,-1.37]],0xcfefff,1);
    const flash=new THREE.PointLight(0xc7e7ff,0,7,1);flash.position.set(-1.65,1.35,-.9);lightning.add(flash);lightning.visible=false;

    const skyStops=[
      {p:0,top:0x45667c,hor:0xe5a586},
      {p:.25,top:0x438ca5,hor:0xb5d9d3},
      {p:.5,top:0x594e78,hor:0xf0ad78},
      {p:.75,top:0x101d3f,hor:0x324766},
      {p:1,top:0x45667c,hor:0xe5a586}
    ];
    const tempA=new THREE.Color(),tempB=new THREE.Color();
    const inverseBottle=new THREE.Matrix3();
    function setSky(phase,storm){
      let k=0;while(k<3&&phase>skyStops[k+1].p)k++;
      const a=skyStops[k],b=skyStops[k+1],t=(phase-a.p)/(b.p-a.p);
      skyMat.uniforms.uTop.value.copy(tempA.setHex(a.top).lerp(tempB.setHex(b.top),t));
      skyMat.uniforms.uHorizon.value.copy(tempA.setHex(a.hor).lerp(tempB.setHex(b.hor),t));
      skyMat.uniforms.uStorm.value=storm;
      const sunAngle=phase*TAU,day=Math.max(0,Math.sin(sunAngle));
      const night=Math.max(0,-Math.sin(sunAngle));
      starMat.opacity=Math.pow(night,1.3)*.84*(1-storm*.58);
      sun.visible=sunHalo.visible=phase<.5;
      moon.visible=moonHalo.visible=phase>=.5;
      if(phase<.5){sun.position.set(-3.1+phase*12.4,.12+Math.sin(phase*Math.PI*2)*1.25,-.95);sunHalo.position.copy(sun.position);}
      else {const mp=phase-.5;moon.position.set(-3.1+mp*12.4,.12+Math.sin(mp*Math.PI*2)*1.25,-.95);moonHalo.position.copy(moon.position);}
      const light=Math.max(.25,day*.7+.48);
      waterMat.uniforms.uLight.value=light;
      waterBody.material.uniforms.uLight.value=light;
      deepBackdropMat.uniforms.uLight.value=light;
      ambient.intensity=.78+day*.62;
      interiorFill.intensity=2.1+day*2.1;
      lampLight.intensity=.9+night*3.4;
      lampGlow.material.opacity=.55+night*.42;
      hutGlow.material.opacity=.45+night*.5;
      chestGlow.material.opacity=.35+night*.3;
      treasureLight.intensity=1.15+night*1.7;
      cloudMat.color.setHex(storm>.35?0x777e8b:night>.5?0x8391aa:0xffffff);
      renderer.toneMappingExposure=1.43+day*.24+night*.02;
      let name=phase<.115?'黎明 · DAWN':phase<.385?'正午 · DAY':phase<.615?'黄昏 · DUSK':phase<.885?'子夜 · NIGHT':'黎明 · DAWN';
      if(storm>.45)name='风暴 · TEMPEST';
      phaseEl.textContent=name;
      const mins=Math.floor(((phase*24+6)%24)*60);clockEl.textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
    }
    function waveHeight(x,z,t,storm){
      const q=Math.sin(x*2.3+t*1.4)*.072+Math.sin(z*3.1-t*1.8+x*.5)*.052+Math.sin((x+z)*5.1+t*2.7)*.025;
      const s=Math.sin(x*4.1+t*3.2)*.095+Math.sin(z*5.7-t*4.6)*.075+Math.sin((x-z)*8+t*5.1)*.04;
      return q+storm*s;
    }
    let speed=1,simTime=0,stormTarget=0,storm=0,last=performance.now(),lightningTimer=0;
    const speedButtons=[...document.querySelectorAll('[data-speed]')];
    speedButtons.forEach(button=>button.addEventListener('click',()=>{
      speed=Number(button.dataset.speed);
      speedButtons.forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    }));
    function setStorm(on){stormTarget=on?1:0;stormButton.classList.toggle('active',on);}
    window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)setStorm(true);}});
    window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();setStorm(false);}});
    window.addEventListener('blur',()=>setStorm(false));
    stormButton.addEventListener('pointerdown',e=>{e.preventDefault();stormButton.setPointerCapture(e.pointerId);setStorm(true);});
    for(const type of ['pointerup','pointercancel','lostpointercapture'])stormButton.addEventListener(type,()=>setStorm(false));
    function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));}
    window.addEventListener('resize',resize);

    function updateWake(dt,t,shipX,shipZ,heading){
      const sternX=shipX-Math.cos(heading)*.77,sternZ=shipZ+Math.sin(heading)*.77;
      wakeAcc+=dt*(storm>.4?50:26);
      while(wakeAcc>1){wakeAcc--;
        const w=wake[wakeIndex];w.life=1.5+rand()*.7;w.x=sternX+(rand()-.5)*.13;w.z=sternZ+(rand()-.5)*.28;
        w.dx=-Math.cos(heading)*(.12+rand()*.12)+(rand()-.5)*.05;
        w.dz=Math.sin(heading)*(.12+rand()*.12)+(rand()-.5)*.08;
        wakeIndex=(wakeIndex+1)%wake.length;
      }
      wake.forEach((w,i)=>{
        if(w.life>0){w.life-=dt;w.x+=w.dx*dt;w.z+=w.dz*dt;dummy.position.set(w.x,SEA+waveHeight(w.x,w.z,t,storm)+.055,w.z);const s=Math.max(.001,.7+w.life*.45);dummy.scale.set(s,.5,s);}
        else {dummy.position.set(0,-10,0);dummy.scale.set(.001,.001,.001);}
        dummy.rotation.set(0,0,0);dummy.updateMatrix();wakeMesh.setMatrixAt(i,dummy.matrix);
      });wakeMesh.instanceMatrix.needsUpdate=true;
      for(let i=0;i<32;i++){
        const a=i*2.399+t*5.4,life=(i*.19+t*2.3)%1;
        const bowX=shipX+Math.cos(heading)*.79,bowZ=shipZ-Math.sin(heading)*.79;
        dummy.position.set(bowX+Math.cos(a)*(.07+life*.12),SEA+waveHeight(bowX,bowZ,t,storm)+.03+Math.sin(life*Math.PI)*(.08+storm*.22),bowZ+Math.sin(a)*(.06+life*.13));
        const s=(1-life)*(.7+storm*.65);dummy.scale.set(s,s,s);dummy.updateMatrix();splashMesh.setMatrixAt(i,dummy.matrix);
      }splashMesh.instanceMatrix.needsUpdate=true;dummy.scale.set(1,1,1);
    }
    function update(t,dt){
      const phase=(.48+t/150)%1;
      storm+=((stormTarget)-storm)*Math.min(1,dt*2.9);
      setSky(phase,storm);
      waterMat.uniforms.uTime.value=t;waterMat.uniforms.uStorm.value=storm;
      bottleRig.rotation.z=Math.sin(performance.now()*.0037)*storm*.016;
      bottleRig.rotation.x=Math.sin(performance.now()*.0049+1)*storm*.027;
      bottleRig.updateWorldMatrix(false,false);
      inverseBottle.setFromMatrix4(bottleRig.matrixWorld).invert();
      waterBody.material.uniforms.uInvBottle.value.copy(inverseBottle);
      beamPivot.rotation.y=t*.42;
      beam.material.opacity=(.04+Math.max(0,-Math.sin(phase*TAU))*.12)*(1-storm*.45);
      const orbit=t*.093+2.3;
      const sx=.72+1.82*Math.cos(orbit),sz=-.03+1.0*Math.sin(orbit);
      const vx=-1.82*Math.sin(orbit),vz=1.0*Math.cos(orbit),heading=-Math.atan2(vz,vx);
      const co=Math.cos(heading),si=Math.sin(heading);
      function sample(lx,lz){const x=sx+co*lx+si*lz,z=sz-si*lx+co*lz;return waveHeight(x,z,t,storm);}
      const bow=sample(.68,0),stern=sample(-.68,0),port=sample(0,.22),starboard=sample(0,-.22);
      const buoyantBase=SEA+(bow+stern+port+starboard)*.25+.025;
      const roofBase=Math.sqrt(1.89*1.89-Math.pow(Math.abs(sz)+.18,2))-1.69;
      ship.position.set(sx,C+Math.min(buoyantBase,roofBase),sz);
      ship.rotation.y=heading;
      ship.rotation.z=THREE.MathUtils.clamp(Math.atan2(bow-stern,1.36),-.14,.14);
      ship.rotation.x=THREE.MathUtils.clamp(-Math.atan2(port-starboard,.44),-.1,.1);
      shipBody.rotation.z=Math.sin(t*.45)*.012;
      updateWake(dt,t,sx,sz,heading);
      buoy.position.set(-3.35,SEA+waveHeight(-3.35,.95,t,storm),.95);
      buoy.rotation.z=Math.sin(t*1.6)*(.04+storm*.1);
      for(let i=0;i<6;i++){
        const a=t*(.28+i*.025)+i*TAU/6,rx=1.72+(i%3)*.24;
        gulls[i].position.set(.25+Math.cos(a)*rx,.76+.17*Math.sin(a*1.8+i),-.16+Math.sin(a)*(.65+i%2*.2));
        gulls[i].rotation.y=-a-.6;gulls[i].rotation.z=Math.sin(t*5+i)*.09;
      }
      const leap=(t%31)/31;
      whale.visible=leap>.39&&leap<.55;
      if(whale.visible){const u=(leap-.39)/.16;
        whale.position.set(-2.8+1.25*u,SEA-.33+Math.sin(u*Math.PI)*.8,-1.02);
        whale.rotation.z=-.45+u*.9;whale.rotation.y=.25;
      }
      fishGroups.forEach((g,i)=>{
        g.position.set([-2.6,-.2,2.3][i]+Math.sin(t*.38+i)*.28,[-1.0,-1.4,-1.08][i]+Math.sin(t*.8+i)*.07,[-.56,.62,-.76][i]+Math.cos(t*.35+i)*.18);
        g.rotation.y=Math.sin(t*.38+i)*.38;
      });
      bubbleData.forEach((b,i)=>{const y=-1.68+((b.y+1.68+t*b.s)%1.25);dummy.position.set(b.x+Math.sin(t*1.2+b.p)*.035,y,b.z+Math.cos(t+b.p)*.035);const s=.7+(y+1.68)*.28;dummy.scale.set(s,s,s);dummy.updateMatrix();bubbles.setMatrixAt(i,dummy.matrix);});bubbles.instanceMatrix.needsUpdate=true;dummy.scale.set(1,1,1);
      lightningTimer-=dt;
      if(storm>.56&&lightningTimer<=0){lightning.visible=Math.random()<.17;flash.intensity=lightning.visible?12:0;lightningTimer=lightning.visible?.14:.24+rand()*.4;}
      if(storm<.25){lightning.visible=false;flash.intensity=0;lightningTimer=0;}
      if(storm>.5&&lightning.visible)renderer.toneMappingExposure+=.23;
    }
    function frame(now){
      const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
      simTime+=dt*speed;
      update(simTime,dt);
      controls.autoRotate=now-lastInteraction>6500;
      controls.update(dt);
      renderer.render(scene,camera);
      if (!window.__bottledOceanReady) {
        window.__bottledOceanReady = true;
        document.getElementById('loadError')?.remove();
      }
      requestAnimationFrame(frame);
    }
    setSky(.48,0);requestAnimationFrame(frame);
  </script>
