<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23333a42' stroke-width='3'/%3E%3Cg stroke='%23e8453c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 5v22M5 16h22M8 8l16 16M24 8L8 24'/%3E%3C/g%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #dceef5 0%, #eef6f9 55%, #f7fbfc 100%);
    color: #22303a;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #1f2d38; }
  header p { margin-top: 6px; font-size: 13.5px; color: #5d7080; letter-spacing: .5px; }

  .stage {
    width: 100%;
    max-width: 980px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 18px 48px rgba(31, 64, 89, .14), 0 2px 8px rgba(31, 64, 89, .06);
    overflow: hidden;
  }
  .stage svg { display: block; width: 100%; height: auto; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 20px;
    border-top: 1px solid #edf1f4;
    background: #fbfdfe;
  }
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    border-radius: 999px;
    transition: transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .btn:active { transform: scale(.95); }
  #playBtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px;
    color: #fff;
    background: #25323d;
    font-weight: 600;
  }
  #playBtn:hover { background: #33444f; }
  #playBtn svg { width: 15px; height: 15px; fill: currentColor; }
  .speed-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #eef2f5;
    border-radius: 999px;
    padding: 4px;
  }
  .speed-group .label { font-size: 12.5px; color: #788896; padding: 0 8px 0 10px; }
  .speed-btn {
    padding: 7px 16px;
    background: transparent;
    color: #5a6b79;
    font-weight: 600;
  }
  .speed-btn.active {
    background: #ffffff;
    color: #1f2d38;
    box-shadow: 0 1px 4px rgba(31, 64, 89, .18);
  }
  .hint { margin-top: 12px; font-size: 12.5px; color: #8295a3; }
  @media (max-width: 520px) {
    header h1 { font-size: 21px; }
    .controls { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sunRays { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>鹈鹕骑自行车</h1>
  <p>纯 SVG 手绘 · 踏频联动车轮与风景滚动</p>

<div class="stage">

    <!-- 近侧腿（在牙盘之前） -->
    <line id="nearThigh" x1="330" y1="248" x2="360" y2="290" stroke="#ef8f1c" stroke-width="13" stroke-linecap="round"/>
    <line id="nearShin"  x1="360" y1="290" x2="377" y2="338" stroke="#f6a135" stroke-width="11" stroke-linecap="round"/>

    <!-- 蹼足 -->
    <g id="farFoot">
      <ellipse cx="0" cy="-2" rx="8" ry="4" fill="#d97d12"/>
      <path d="M6,-3 L14,-4 L8,0 Z M6,0 L15,1 L8,3 Z" fill="#c4710e"/>
    </g>
    <g id="nearFoot">
      <ellipse cx="0" cy="-2" rx="9" ry="4.5" fill="#f6a135"/>
      <path d="M7,-3 L16,-4 L9,0 Z M7,0 L17,1 L9,3 Z" fill="#ed9121"/>
    </g>
    <!-- 踏板（最后绘制，压在脚下） -->
    <g id="ped2">
      <rect x="-7" y="-3" width="14" height="6" rx="2" fill="#565f6a"/>
    </g>
    <g id="ped1">
      <rect x="-9" y="-3.5" width="18" height="7" rx="2" fill="#2c3138"/>
      <rect x="-9" y="-3.5" width="18" height="2.6" rx="1.3" fill="#4a525d"/>
    </g>

  </g>
</svg>

  <div class="controls">
    <button class="btn" id="playBtn" type="button" aria-label="暂停或播放动画">
      <svg id="iconPause" viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
      <svg id="iconPlay" viewBox="0 0 16 16" style="display:none"><path d="M4 2.5v11l9-5.5z"/></svg>
      <span id="playText">暂停</span>
    </button>
    <div class="speed-group" role="group" aria-label="骑行速度">
      <span class="label">速度</span>
      <button class="btn speed-btn" type="button" data-mul="0.6">慢</button>
      <button class="btn speed-btn active" type="button" data-mul="1">正常</button>
      <button class="btn speed-btn" type="button" data-mul="1.6">快</button>
    </div>
  </div>
</div>
<p class="hint">提示：按空格键也可暂停 / 继续；开启系统“减少动态效果”时动画会默认暂停。</p>

<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";

  // ---------- 自行车参数 ----------
  var BB = { x: 360, y: 338 };   // 中轴（牙盘中心）
  var CRANK_LEN = 17;            // 曲柄长度
  var WHEEL_R = 58;              // 车轮半径
  var GEAR = 2.2;                // 传动比：曲柄一圈 -> 车轮 2.2 圈
  var CADENCE = 1.0;             // 踏频（圈/秒）
  var H1 = { x: 330, y: 248 };   // 近侧髋点
  var H2 = { x: 324, y: 247 };   // 远侧髋点
  var L1 = 52, L2 = 62;          // 大腿 / 小腿长度

  // ---------- 状态 ----------
  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused = !!reduceMotion;
  var speedMul = 1;
  var crank = 0.6, wheel = 0, dist = 0;

  // ---------- 元素引用 ----------
  var $ = function (id) { return document.getElementById(id); };
  var rearSpokes = $("rearSpokes"), frontSpokes = $("frontSpokes");
  var crankSpin = $("crankSpin"), rider = $("rider");
  var farThigh = $("farThigh"), farShin = $("farShin");
  var nearThigh = $("nearThigh"), nearShin = $("nearShin");
  var farFoot = $("farFoot"), nearFoot = $("nearFoot");
  var ped1 = $("ped1"), ped2 = $("ped2");
  var layerFar = $("layerFar").children;
  var layerNear = $("layerNear").children;

  var movers = [];
  var collect = function (selector) {
    var nodes = document.querySelectorAll(selector);
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i], d = el.dataset;
      movers.push({
        el: el,
        par: parseFloat(d.par),
        span: parseFloat(d.span),
        x: parseFloat(d.x),
        y: parseFloat(d.y || 0),
        s: parseFloat(d.s || 1)
      });
    }
  };
  collect("#layerClouds use");
  collect("#layerTrees use");
  collect("#layerScenery use");
  collect("#layerDashes use");

  // ---------- 太阳光芒 ----------
  var rayLines = $("rayLines");
  for (var i = 0; i < 12; i++) {
    var a = i * Math.PI / 6;
    var line = document.createElementNS(SVGNS, "line");
    line.setAttribute("x1", (Math.cos(a) * 45).toFixed(1));
    line.setAttribute("y1", (Math.sin(a) * 45).toFixed(1));
    line.setAttribute("x2", (Math.cos(a) * 58).toFixed(1));
    line.setAttribute("y2", (Math.sin(a) * 58).toFixed(1));
    rayLines.appendChild(line);
  }

  // ---------- 工具函数 ----------
  var mod = function (n, m) { return ((n % m) + m) % m; };

  // 二连杆逆运动学：已知髋点 H 与足点 P，求膝盖 K（取上方交点）
  function knee(H, P) {
    var dx = P.x - H.x, dy = P.y - H.y;
    var raw = Math.hypot(dx, dy);
    var d = Math.min(Math.max(raw, Math.abs(L2 - L1) + 0.5), L1 + L2 - 0.5);
    var ux = dx / raw, uy = dy / raw;
    var along = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - along * along));
    var mx = H.x + ux * along, my = H.y + uy * along;
    var px = -uy, py = ux; // 垂直方向
    var k1 = { x: mx + px * h, y: my + py * h };
    var k2 = { x: mx - px * h, y: my - py * h };
    return k1.y <= k2.y ? k1 : k2;
  }

  function setLine(el, a, b) {
    el.setAttribute("x1", a.x.toFixed(1));
    el.setAttribute("y1", a.y.toFixed(1));
    el.setAttribute("x2", b.x.toFixed(1));
    el.setAttribute("y2", b.y.toFixed(1));
  }

  // ---------- 渲染 ----------
  function render() {
    // 车轮与曲柄
    var wheelDeg = wheel * 180 / Math.PI;
    rearSpokes.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    frontSpokes.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    crankSpin.setAttribute("transform", "rotate(" + (crank * 180 / Math.PI).toFixed(2) + ")");

    // 踏板位置（两相位差 180°，踏板始终保持水平）
    var c = Math.cos(crank), s = Math.sin(crank);
    var P1 = { x: BB.x + CRANK_LEN * c, y: BB.y + CRANK_LEN * s };
    var P2 = { x: BB.x - CRANK_LEN * c, y: BB.y - CRANK_LEN * s };
    ped1.setAttribute("transform", "translate(" + P1.x.toFixed(1) + "," + P1.y.toFixed(1) + ")");
    ped2.setAttribute("transform", "translate(" + P2.x.toFixed(1) + "," + P2.y.toFixed(1) + ")");
    nearFoot.setAttribute("transform", "translate(" + P1.x.toFixed(1) + "," + (P1.y - 2).toFixed(1) + ")");
    farFoot.setAttribute("transform", "translate(" + P2.x.toFixed(1) + "," + (P2.y - 2).toFixed(1) + ")");

    // 双腿 IK
    var K1 = knee(H1, P1), K2 = knee(H2, P2);
    setLine(nearThigh, H1, K1); setLine(nearShin, K1, P1);
    setLine(farThigh, H2, K2);  setLine(farShin, K2, P2);

    // 车身随踏频轻微颠簸 / 摇摆
    var bobY = Math.sin(wheel * 2) * 1.2 + Math.sin(crank * 2) * 0.7;
    var bobR = Math.sin(crank) * 0.65;
    rider.setAttribute("transform",
      "translate(0," + bobY.toFixed(2) + ") rotate(" + bobR.toFixed(2) + " 380 330)");

    // 山丘无缝拼接
    var fx = mod(-dist * 0.4, 1000) - 1000;
    layerFar[0].setAttribute("x", fx.toFixed(1));
    layerFar[1].setAttribute("x", (fx + 1000).toFixed(1));
    var nx = mod(-dist * 0.62, 1000) - 1000;
    layerNear[0].setAttribute("x", nx.toFixed(1));
    layerNear[1].setAttribute("x", (nx + 1000).toFixed(1));

    // 视差装饰元素循环
    for (var i = 0; i < movers.length; i++) {
      var m = movers[i];
      var x = mod(m.x - dist * m.par, m.span) - 90;
      m.el.setAttribute("transform",
        "translate(" + x.toFixed(1) + "," + m.y + ") scale(" + m.s + ")");
    }
  }

  // ---------- 主循环 ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) {
      var omega = 2 * Math.PI * CADENCE * speedMul;
      crank += omega * dt;
      wheel += omega * GEAR * dt;
      dist += omega * GEAR * WHEEL_R * dt;
    }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- 控件 ----------
  var playBtn = $("playBtn"), playText = $("playText");
  var iconPause = $("iconPause"), iconPlay = $("iconPlay");
  function syncPlayUI() {
    iconPause.style.display = paused ? "none" : "";
    iconPlay.style.display = paused ? "" : "none";
    playText.textContent = paused ? "播放" : "暂停";
  }
  playBtn.addEventListener("click", function () {
    paused = !paused;
    syncPlayUI();
  });

  var speedBtns = document.querySelectorAll(".speed-btn");
  for (var j = 0; j < speedBtns.length; j++) {
    speedBtns[j].addEventListener("click", function () {
      for (var k = 0; k < speedBtns.length; k++) speedBtns[k].classList.remove("active");
      this.classList.add("active");
      speedMul = parseFloat(this.dataset.mul);
    });
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      paused = !paused;
      syncPlayUI();
    }
  });

  syncPlayUI();
  render();
  requestAnimationFrame(frame);
})();
</script>

<style>
  @keyframes sunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</body>
</html>
