<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4eb">
  <title>海风骑行 · Pelican on a bicycle</title>
  <style>
    :root { color-scheme: light; --ink: #304d48; --paper: #f6f4eb; --muted: #84958b; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button { font: inherit; }
    .page { min-height: 100svh; padding: 30px 46px 24px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; letter-spacing: 2px; }
    .brand svg { width: 29px; height: 29px; }
    .edition { font-size: 10px; letter-spacing: 2.5px; color: #839087; }
    main { position: relative; flex: 1; display: grid; align-items: center; min-height: 480px; }
    .intro { position: absolute; top: 9%; left: 5.4%; z-index: 1; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: 3px; color: #80968a; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: #9bb4a4; }
    h1 { margin: 20px 0 14px; font-family: "Songti SC", "STSong", Georgia, serif; font-size: clamp(30px, 3.4vw, 53px); font-weight: 500; letter-spacing: 4px; line-height: 1.35; }
    .intro p { margin: 0; color: #8b988e; font-size: 12px; letter-spacing: 2px; line-height: 1.9; }
    .scene { display: block; width: 100%; height: auto; max-height: calc(100svh - 125px); min-height: 480px; overflow: visible; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 42px; }
    .caption { display: flex; align-items: center; gap: 12px; font-size: 10px; letter-spacing: 2px; color: #839087; }
    .dot { width: 6px; height: 6px; background: #83a38c; border-radius: 50%; }
    .controls { display: flex; align-items: center; gap: 9px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px solid #dce2d8; border-radius: 24px; color: #536b60; background: #fafaf4; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: background .2s, border-color .2s; }
    button:hover { background: #e9eee3; border-color: #b5c4b6; }
    button:focus-visible { outline: 2px solid #458d79; outline-offset: 4px; }
    button svg { width: 12px; height: 12px; }
    #speed { min-width: 72px; font-variant-numeric: tabular-nums; }
    .sound-note { font-size: 10px; color: #9aa497; margin-right: 9px; letter-spacing: 1px; }
    @media (max-width: 700px) {
      .page { padding: 22px 20px; }
      .brand { font-size: 11px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      main { min-height: 560px; overflow: hidden; }
      .intro { top: 40px; left: 9px; }
      h1 { font-size: 35px; }
      .intro p { font-size: 11px; }
      .scene { width: 960px; max-width: none; height: 574px; min-height: 0; max-height: none; position: relative; left: 50%; transform: translateX(-52%); margin-top: 130px; }
      footer { align-items: flex-end; }
      .caption { font-size: 8px; letter-spacing: 1px; gap: 7px; }
      .sound-note { display: none; }
      button { height: 36px; padding: 0 10px; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'leg-front', 'leg-back',
        'leg-highlight', 'foot-front', 'foot-back', 'pelican', 'scarf-long',
        'scarf-short', 'eye', 'clouds', 'hills', 'ripples', 'road-marks',
        'foreground', 'bike-shadow', 'distant-birds'
      ].map(id => [id, $(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let previous = null;
      let frame = null;
      const cycle = Math.PI * 2;

      // Solve the knee position from a fixed hip and a foot on the crank circle.
      function leg(phase, near, bob) {
        const hip = { x: near ? 674 : 684, y: (near ? 452 : 459) + bob };
        const foot = { x: 720 + 36 * Math.cos(phase), y: 579 + 36 * Math.sin(phase) };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 100, lower = 108;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + along * dx / distance + bend * dy / distance;
        const kneeY = hip.y + along * dy / distance - bend * dx / distance;
        const path = `M${hip.x} ${hip.y} L${kneeX} ${kneeY} L${foot.x} ${foot.y}`;
        parts[near ? 'leg-front' : 'leg-back'].setAttribute('d', path);
        if (near) parts['leg-highlight'].setAttribute('d', path);
        parts[near ? 'foot-front' : 'foot-back'].setAttribute('transform', `translate(${foot.x} ${foot.y})`);
      }

      function draw(t) {
        const phase = t * cycle * .62;
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 2;
        // Wheel circumference and passing ground use the same travel distance.
        const travel = t * 158;
        const wheelAngle = travel / 108 * 180 / Math.PI;
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts.crank.setAttribute('transform', `rotate(${degrees % 360} 720 593)`);
        leg(phase + Math.PI, false, bob);
        leg(phase, true, bob);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        const flutter = Math.sin(t * 7) * 7;
        const flutter2 = Math.sin(t * 7 - 1.2) * 5;
        parts['scarf-long'].setAttribute('d', `M715 333 C678 ${315 + flutter2} 665 ${345 + flutter} 630 ${326 + flutter2} S594 ${325 + flutter} 574 ${312 + flutter} L581 ${334 + flutter} C608 ${338 + flutter} 615 ${333 + flutter2} 634 ${344 + flutter2} S687 ${333 + flutter} 716 353 Z`);
        parts['scarf-short'].setAttribute('d', `M716 337 C691 345 681 ${364 + flutter2} 650 ${356 + flutter} L658 ${374 + flutter} C684 ${378 + flutter2} 702 357 724 352 Z`);
        const blinkTime = t % 4.8;
        const blink = blinkTime > 4.55 ? Math.max(.06, Math.abs(blinkTime - 4.675) / .125) : 1;
        parts.eye.setAttribute('transform', `translate(0 ${235 * (1 - blink)}) scale(1 ${blink})`);
        parts.clouds.setAttribute('transform', `translate(${-Math.sin(t * .06) * 37} ${Math.sin(t * .14) * 3})`);
        parts.hills.setAttribute('transform', `translate(${-(t * 8 % 1540)} 0)`);
        parts.ripples.setAttribute('transform', `translate(${Math.sin(t * .5) * 10} 0)`);
        parts['distant-birds'].setAttribute('transform', `translate(${-Math.sin(t * .15) * 18} ${Math.sin(t * 1.4) * 4})`);
        parts['road-marks'].setAttribute('transform', `translate(${-(travel % 360)} 0)`);
        parts.foreground.setAttribute('transform', `translate(${-(t * 190 % 1270)} 0)`);
        parts['bike-shadow'].setAttribute('rx', 254 + Math.sin(phase * 2) * 2);
      }

      function tick(now) {
        frame = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw(time);
        frame = requestAnimationFrame(tick);
      }

      function schedule() {
        if (!paused && !document.hidden && frame === null) frame = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        $('toggle').setAttribute('aria-pressed', String(paused));
        $('toggle').setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        $('toggle-label').textContent = paused ? '继续' : '暂停';
        $('toggle-icon').setAttribute('d', paused ? 'M3 1l8 5-8 5z' : 'M2 1h3v10H2zM7 1h3v10H7z');
        $('status').textContent = paused ? '歇一会儿' : '骑行中';
        $('status-dot').style.background = paused ? '#c5ac76' : '#83a38c';
        previous = null;
        if (paused && frame !== null) { cancelAnimationFrame(frame); frame = null; }
        schedule();
      }

      $('toggle').addEventListener('click', () => { paused = !paused; updatePlayback(); });
      $('speed').addEventListener('click', () => {
        const speeds = [.5, 1, 1.5, 2];
        speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
        $('speed').textContent = `${speed}× 速度`;
        $('speed').setAttribute('aria-label', `当前速度 ${speed} 倍，点击切换骑行速度`);
      });
      document.addEventListener('visibilitychange', () => {
        previous = null;
        if (document.hidden && frame !== null) { cancelAnimationFrame(frame); frame = null; }
        schedule();
      });
      reducedMotion.addEventListener('change', event => { paused = event.matches; updatePlayback(); });
      draw(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
