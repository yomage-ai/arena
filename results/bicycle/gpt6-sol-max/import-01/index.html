<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #d9eee8; }
    svg { display: block; width: 100%; height: 100%; }

    .cloud-left { animation: cloud-left 9s ease-in-out infinite alternate; }
    .cloud-right { animation: cloud-right 12s ease-in-out infinite alternate; }
    .sea-line { animation: sea-drift 5s linear infinite; }
    .road-lines { animation: road-drift 1.3s linear infinite; }
    .ride { animation: ride-bob .65s ease-in-out infinite alternate; }
    .wing { transform-box: view-box; transform-origin: 485px 287px; animation: wing-float 1.3s ease-in-out infinite alternate; }
    .scarf-end { transform-box: view-box; transform-origin: 633px 246px; animation: scarf-flutter .85s ease-in-out infinite alternate; }

    @keyframes cloud-left { to { transform: translateX(42px); } }
    @keyframes cloud-right { to { transform: translateX(-58px); } }
    @keyframes sea-drift { to { transform: translateX(-160px); } }
    @keyframes road-drift { to { transform: translateX(-240px); } }
    @keyframes ride-bob { to { transform: translateY(-4px); } }
    @keyframes wing-float { to { transform: rotate(-4deg); } }
    @keyframes scarf-flutter { to { transform: rotate(7deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <svg id="scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-title">鹈鹕骑自行车的海边动画</title>
    <desc id="scene-desc">一只戴着蓝绿色围巾的鹈鹕骑着珊瑚色自行车，沿着海边公路前行。车轮、脚踏、云和路面循环运动。</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dff2e9"/>
        <stop offset=".67" stop-color="#f4e9d4"/>
        <stop offset="1" stop-color="#f8e2be"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9bcac4"/>
        <stop offset="1" stop-color="#bddbd0"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4ad69"/>
        <stop offset="1" stop-color="#de765f"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#fffdf2"/>
        <stop offset="1" stop-color="#e5ece0"/>
      </linearGradient>
      <filter id="soft-shadow" x="-30%" y="-150%" width="160%" height="400%">

      </filter>
      <clipPath id="road-clip"><rect x="0" y="632" width="1200" height="88"/></clipPath>
    </defs>

    <circle cx="968" cy="128" r="61" fill="#ffe7ad"/>
    <circle cx="968" cy="128" r="50" fill="#fff0c5" opacity=".55"/>

    <g class="cloud-left" fill="#fffdf2" opacity=".9">

      <!-- Chain, frame and fork -->

      <circle cx="365" cy="525" r="16" fill="#f1d7a5" stroke="#29484f" stroke-width="5"/>
      <circle cx="575" cy="525" r="29" fill="#f1d7a5" stroke="#29484f" stroke-width="5"/>
      <circle cx="575" cy="525" r="17" fill="#e7ba75" stroke="#29484f" stroke-width="4"/>
      <path d="M365 525 515 365 575 525 365 525M515 365 735 385 575 525M735 385 805 525" fill="none" stroke="#29484f" stroke-width="18"/>
      <path d="M365 525 515 365 575 525 365 525M515 365 735 385 575 525M735 385 805 525" fill="none" stroke="#df7267" stroke-width="11"/>
      <path d="M735 385 805 525" fill="none" stroke="#f4c189" stroke-width="5"/>
      <path d="M515 365 505 340" fill="none" stroke="#29484f" stroke-width="11"/>
      <path d="M469 342q50-10 94 4 5 3-2 9h-97q-12-5 5-13z" fill="#29484f"/>
      <path d="M733 384 746 343q7-18 27-17h35" fill="none" stroke="#29484f" stroke-width="12"/>
      <path d="M786 326h34" stroke="#f3bd82" stroke-width="13"/>
      <circle cx="758" cy="339" r="11" fill="#f4d58e" stroke="#29484f" stroke-width="4"/>
      <circle cx="805" cy="525" r="16" fill="#f1d7a5" stroke="#29484f" stroke-width="5"/>

      <!-- A little woven basket and flowers -->
      <path d="M797 347h89l-10 61q-35 11-68 0z" fill="#d8a16e" stroke="#29484f" stroke-width="5"/>
      <path d="M803 364h80M806 382h74M812 400h64M820 350l6 60M844 350v61M868 350l-6 60" fill="none" stroke="#f1c696" stroke-width="3" opacity=".75"/>
      <path d="M828 347q-12-24-12-42m33 42q11-22 8-45m7 45q23-22 22-34" fill="none" stroke="#638d75" stroke-width="4"/>
      <g fill="#f4dd8b" stroke="#dc997c" stroke-width="2">
        <circle cx="813" cy="306" r="9"/><circle cx="859" cy="303" r="10"/><circle cx="886" cy="312" r="8"/>
      </g>
      <g fill="#dc816b"><circle cx="813" cy="306" r="3"/><circle cx="859" cy="303" r="3"/><circle cx="886" cy="312" r="3"/></g>

      <!-- Tail and full, creamy body -->
      <path d="M466 291q-48-34-74-19 22 10 42 30-37-14-62 2 32 2 61 16" fill="#f7f6e9" stroke="#29484f" stroke-width="5"/>
      <path d="M448 273c30-45 116-52 174-22 46 24 68 70 42 105-24 33-80 46-143 34-55-11-94-37-99-72-3-18 6-35 26-45z" fill="url(#body)" stroke="#29484f" stroke-width="6"/>
      <path d="M439 303q-5 39 43 67m35 11q52 15 94-3" fill="none" stroke="#c7d9cf" stroke-width="5" opacity=".8"/>

      <!-- Folded wing, with gently floating feather tips -->
      <g class="wing">
        <path d="M471 280c53-29 106-16 126 20-7 40-49 59-97 50-38-7-62-29-63-48-1-14 11-21 34-22z" fill="#e9efe1" stroke="#29484f" stroke-width="5"/>
        <path d="M465 317q30 25 67 15m-28 12q27 11 60-4m-12-60q30 9 36 27" fill="none" stroke="#bed1c8" stroke-width="5"/>
      </g>

      <!-- The long S-shaped neck and cheerful head -->
      <path d="M584 306c20-42 18-81 36-132 11-34 42-48 72-42 34 6 58 32 53 64-4 29-30 44-57 49-25 5-36 22-43 50-7 28-13 50-30 56-14 5-27-10-31-45z" fill="url(#body)" stroke="#29484f" stroke-width="6"/>
      <path d="M621 190q4-38 34-49" fill="none" stroke="#cbdcd0" stroke-width="7" opacity=".8"/>
      <path d="M665 130q0-23 13-30 2 17 8 27m1 2q10-22 24-22-10 14-11 28" fill="#fff9eb" stroke="#29484f" stroke-width="5"/>

      <!-- Oversized bill and salmon-colored throat pouch -->
      <path d="M708 190c67 15 164 25 271 37-19 30-79 55-153 53-64-2-107-34-118-90z" fill="url(#pouch)" stroke="#29484f" stroke-width="6"/>
      <path d="M750 225q71 51 170 18" fill="none" stroke="#f8c38b" stroke-width="4" opacity=".58"/>
      <path d="M701 174c90-1 186 20 275 43 11 3 17 8 13 13-3 5-13 7-22 6-103-9-192-20-261-37z" fill="#f2b266" stroke="#29484f" stroke-width="6"/>
      <path d="M724 184q121 4 240 39" fill="none" stroke="#ffe0a0" stroke-width="5" opacity=".9"/>
      <path d="M965 226q10 3 22 2" fill="none" stroke="#d17757" stroke-width="5"/>
      <circle cx="701" cy="163" r="11" fill="#fffdf0" stroke="#29484f" stroke-width="4"/>
      <circle cx="704" cy="162" r="4.5" fill="#29484f"/>
      <circle cx="706" cy="160" r="1.6" fill="#fff"/>
      <path d="M678 147q11-6 23-2" fill="none" stroke="#29484f" stroke-width="4"/>

      <!-- Breezy scarf -->

        <path d="M635 246q-20 7-32-2-20-13-36 4 17 1 27 16 20 19 44-3z" fill="#65aca1" stroke="#29484f" stroke-width="4"/>
        <path d="M573 247q16 5 25 17" fill="none" stroke="#b4d8ba" stroke-width="3"/>

      <!-- The near leg, crank arms and the two feet are updated together -->

      <path id="front-leg-color" d="M540 350 647 391 575 480" fill="none" stroke="#ec9c62" stroke-width="16"/>
      <circle id="front-knee" cx="647" cy="391" r="8" fill="#f7bd7a"/>

        <path d="M575 480v90"/>
      </g>
      <circle cx="575" cy="525" r="10" fill="#f6d593" stroke="#29484f" stroke-width="4"/>
      <g id="rear-foot" transform="translate(575 570)">
        <path d="M-7-4h39q11 0 12 7 1 7-11 7H-3q-10 0-10-6 0-5 6-8z" fill="#d78359" stroke="#29484f" stroke-width="4"/>
      </g>
      <g id="front-foot" transform="translate(575 480)">
        <path d="M-8-6h41q12 1 13 8 0 8-12 8H-4q-11 0-12-7-1-5 8-9z" fill="#f5b476" stroke="#29484f" stroke-width="4"/>

    <!-- Small editorial details, also drawn inside the SVG -->
    <g fill="#315a5b" font-family="Avenir Next, Nunito Sans, Arial, sans-serif">
      <text x="74" y="67" font-size="16" font-weight="800" letter-spacing="5">PELICAN PEDAL CLUB</text>
      <path d="M74 83h169" stroke="#e59d71" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="111" font-size="12" font-weight="600" letter-spacing="2.2" opacity=".72">A LITTLE RIDE BY THE SEA</text>
    </g>
    <g transform="translate(1082 670)" fill="#315a5b" opacity=".65">
      <circle r="18" fill="none" stroke="#315a5b" stroke-width="2"/>
      <path d="M-8 2h16M0-8v16" stroke="#315a5b" stroke-width="2" stroke-linecap="round"/>
    </g>
  </svg>

  <script>
    (() => {
      const parts = {
        rearRotor: document.getElementById('rear-rotor'),
        frontRotor: document.getElementById('front-rotor'),
        crank: document.getElementById('crank-arms'),
        rearLeg: document.getElementById('rear-leg'),
        frontLeg: document.getElementById('front-leg'),
        frontLegColor: document.getElementById('front-leg-color'),
        rearKnee: document.getElementById('rear-knee'),
        frontKnee: document.getElementById('front-knee'),
        rearFoot: document.getElementById('rear-foot'),
        frontFoot: document.getElementById('front-foot')
      };
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const crankCenter = { x: 575, y: 525 };
      const pedalRadius = 45;
      const cycleSeconds = 1.3;
      let running = false;

      // Two-circle geometry keeps each bent leg joined to its moving pedal.
      function kneeBetween(hip, foot, bendRight) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 123;
        const lower = 121;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const side = Math.sqrt(Math.max(0, upper * upper - along * along));
        const sign = bendRight ? 1 : -1;
        return {
          x: hip.x + dx * along / distance + sign * dy * side / distance,
          y: hip.y + dy * along / distance - sign * dx * side / distance
        };
      }

      function setLeg(path, kneeDot, hip, foot, bendRight) {
        const knee = kneeBetween(hip, foot, bendRight);
        const shape = `M${hip.x} ${hip.y} ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} ${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
        path.setAttribute('d', shape);
        kneeDot.setAttribute('cx', knee.x.toFixed(2));
        kneeDot.setAttribute('cy', knee.y.toFixed(2));
        return shape;
      }

      function draw(seconds) {
        const radians = seconds * Math.PI * 2 / cycleSeconds;
        const degrees = radians * 180 / Math.PI;
        const front = {
          x: crankCenter.x + Math.sin(radians) * pedalRadius,
          y: crankCenter.y - Math.cos(radians) * pedalRadius
        };
        const rear = {
          x: crankCenter.x - Math.sin(radians) * pedalRadius,
          y: crankCenter.y + Math.cos(radians) * pedalRadius
        };

        parts.rearRotor.setAttribute('transform', `rotate(${degrees})`);
        parts.frontRotor.setAttribute('transform', `rotate(${degrees})`);
        parts.crank.setAttribute('transform', `rotate(${degrees} 575 525)`);
        parts.frontFoot.setAttribute('transform', `translate(${front.x.toFixed(2)} ${front.y.toFixed(2)})`);
        parts.rearFoot.setAttribute('transform', `translate(${rear.x.toFixed(2)} ${rear.y.toFixed(2)})`);
        const frontShape = setLeg(parts.frontLeg, parts.frontKnee, { x: 540, y: 350 }, front, true);
        parts.frontLegColor.setAttribute('d', frontShape);
        setLeg(parts.rearLeg, parts.rearKnee, { x: 553, y: 352 }, rear, false);
      }

      function frame(now) {
        if (reducedMotion.matches) { running = false; draw(0); return; }
        draw(now / 1000);
        requestAnimationFrame(frame);
      }

      function start() {
        if (running) return;
        running = true;
        requestAnimationFrame(frame);
      }

      draw(0);
      if (!reducedMotion.matches) start();
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches) draw(0);
        else start();
      });
    })();
  </script>
</body>
