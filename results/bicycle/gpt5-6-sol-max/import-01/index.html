<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一只鹈鹕沿着海岸公路骑自行车的 SVG 2D 动画。">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17364a;
      --cream: #fff8e8;
      --coral: #f05d45;
      --yellow: #f6bd3b;
      --sea: #1f9eb2;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      background: #0e293b;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 420px;
      overflow: hidden;
      background: #98dce0;
      isolation: isolate;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pause-button {
      position: absolute;
      right: clamp(16px, 3vw, 34px);
      bottom: clamp(16px, 3vw, 30px);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 10px 16px;
      border: 2px solid rgba(23, 54, 74, .75);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 248, 232, .9);
      box-shadow: 0 7px 0 rgba(23, 54, 74, .14);
      font: inherit;
      font-size: .9rem;
      font-weight: 750;
      letter-spacing: .04em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .pause-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 0 rgba(23, 54, 74, .14);
      background: #fff8e8;
    }

    .pause-button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(23, 54, 74, .14);
    }

    .pause-button:focus-visible {
      outline: 3px solid #fff8e8;
      outline-offset: 4px;
    }

    .pause-icon {
      width: 14px;
      height: 14px;
      position: relative;
      display: inline-block;
    }

    .pause-icon::before,
    .pause-icon::after {
      content: "";
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 4px;
      border-radius: 2px;
      background: currentColor;
    }

    .pause-icon::before { left: 1px; }
    .pause-icon::after { right: 1px; }

    body.is-paused .pause-icon::before {
      top: 0;
      bottom: 0;
      left: 2px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid currentColor;
      border-radius: 0;
      background: transparent;
    }

    body.is-paused .pause-icon::after { display: none; }

    .cloud-a { animation: cloud-drift 24s linear infinite; }
    .cloud-b { animation: cloud-drift 31s linear -17s infinite; }
    .cloud-c { animation: cloud-drift 27s linear -6s infinite; }
    .distant-sail { animation: sail-drift 18s linear infinite; }
    .bird-one { animation: bird-glide 10s ease-in-out infinite; }
    .bird-two { animation: bird-glide 13s ease-in-out -4s infinite; }
    .road-marks { animation: road-scroll .85s linear infinite; }
    .foreground-sprigs { animation: foreground-scroll 2.4s linear infinite; }
    .wheel-spin,
    .crank-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin .72s linear infinite;
    }
    .crank-spin { animation-duration: 1.05s; }
    .pelican-body { animation: rider-bob 1.05s ease-in-out infinite; }
    .tail-feathers {
      transform-origin: 475px 284px;
      animation: tail-flick 2.1s ease-in-out infinite;
    }
    .wing {
      transform-origin: 555px 256px;
      animation: wing-breathe 2.1s ease-in-out infinite;
    }
    .crest {
      transform-origin: 672px 141px;
      animation: crest-wave 1.05s ease-in-out infinite;
    }
    .pouch {
      transform-origin: 728px 197px;
      animation: pouch-bounce 2.1s ease-in-out infinite;
    }
    .eye-lid {
      transform-origin: 697px 156px;
      animation: blink 4.8s linear infinite;
    }
    .scarf-tail-one {
      transform-origin: 642px 207px;
      animation: scarf-wave .82s ease-in-out infinite alternate;
    }
    .scarf-tail-two {
      transform-origin: 644px 214px;
      animation: scarf-wave .82s ease-in-out -.25s infinite alternate-reverse;
    }
    .bike-shadow { animation: shadow-pulse 1.05s ease-in-out infinite; }
    .bell-note { animation: note-pop 3.4s ease-out infinite; }
    .bell-note.second { animation-delay: .22s; }

    body.is-paused * { animation-play-state: paused !important; }

    @keyframes cloud-drift {
      from { transform: translateX(1400px); }
      to { transform: translateX(-520px); }
    }

    @keyframes sail-drift {
      from { transform: translateX(1250px); }
      to { transform: translateX(-260px); }
    }

    @keyframes bird-glide {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-90px, -12px); }
    }

    @keyframes road-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-210px); }
    }

    @keyframes foreground-scroll {
      from { transform: translateX(1250px); }
      to { transform: translateX(-250px); }
    }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0) rotate(.2deg); }
      50% { transform: translateY(-7px) rotate(-.4deg); }
    }

    @keyframes wing-breathe {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-4deg) scale(1.015); }
    }

    @keyframes tail-flick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes crest-wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }

    @keyframes pouch-bounce {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.8deg); }
    }

    @keyframes scarf-wave {
      from { transform: rotate(-7deg) scaleX(.98); }
      to { transform: rotate(8deg) scaleX(1.06); }
    }

    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(0); }
      45%, 47% { transform: scaleY(1); }
    }

    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: .18; }
      50% { transform: scaleX(.94); opacity: .13; }
    }

    @keyframes note-pop {
      0%, 72% { opacity: 0; transform: translate(0, 0) scale(.5); }
      76% { opacity: 1; transform: translate(0, -4px) scale(1); }
      92% { opacity: 0; transform: translate(22px, -36px) scale(.75); }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="鹈鹕沿海岸骑自行车的动画场景">
    <svg id="pelican-scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-description">

      <!-- Fast foreground details -->

    <button class="pause-button" type="button" aria-pressed="false" aria-label="暂停动画">
      <span class="pause-icon" aria-hidden="true"></span>
      <span class="button-label">暂停</span>
    </button>
  </main>

  <script>
    const scene = document.querySelector('#pelican-scene');
    const button = document.querySelector('.pause-button');
    const label = button.querySelector('.button-label');
    let paused = false;

    function setPaused(nextState) {
      paused = nextState;
      document.body.classList.toggle('is-paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      label.textContent = paused ? '继续' : '暂停';

      if (paused) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }
    }

    button.addEventListener('click', () => setPaused(!paused));

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (reducedMotion.matches) setPaused(true);
  </script>
</body>
</html>
